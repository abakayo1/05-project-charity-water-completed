<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
        </div>
        
        <div id="game-container" tabindex="0" aria-label="Water drop game. Use the left and right arrow keys or drag to move the bucket.">
            <div id="bucket" role="img" aria-label="Yellow water bucket"></div>
            <div id="end-screen" class="end-screen" role="dialog" aria-modal="true" aria-labelledby="end-title" hidden>
                <div id="confetti" class="confetti" aria-hidden="true"></div>
                <div class="result-card">
                    <h2 id="end-title">Great Work!</h2>
                    <p id="final-message"></p>
                    <div class="result-total" aria-label="Points earned out of all possible points">
                        <span class="result-label">Points earned / possible</span>
                        <strong><span id="final-score">0</span> / <span id="possible-points">0</span></strong>
                    </div>
                    <div class="result-actions">
                        <button id="play-again-btn" type="button">Play Again</button>
                        <button id="return-btn" type="button">Return to Main</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
